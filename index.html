<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadro de Tarefas Acadêmicas — Painel de Projetos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Courier+Prime:wght@400;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===================== CABEÇALHO ===================== -->
  <header>
    <h1>Quadro de Tarefas Acadêmicas</h1>
  </header>

  <!-- Região de status: existe e está vazia desde o início. É por ela
       que leitores de tela ficam sabendo dos 4 estados. Fica fora de
       qualquer contêiner que é escondido (mensagem-estado / quadro),
       senão o anúncio nunca chegaria a sair. -->
  <p id="status-regiao" role="status" aria-live="polite" class="sr-only"></p>

  <main>

    <!-- ================ BUSCA E FILTROS ================ -->
    <section >
      <h2 >Busca e filtros</h2>

      <form>

        <!-- Campo de busca por título -->
        <div>
          <label for="busca-titulo">Buscar por título da tarefa</label>
          <input type="search" id="busca-titulo" name="busca-titulo">
        </div>

        <!-- Filtro por status -->
        <fieldset>
          <legend>Filtrar por status</legend>

          <div>
            <input type="radio" id="status-todos" name="status" value="todos" checked>
            <label for="status-todos">Todos</label>
          </div>

          <div>
            <input type="radio" id="status-a-fazer" name="status" value="a-fazer">
            <label for="status-a-fazer">A fazer</label>
          </div>

          <div>
            <input type="radio" id="status-em-andamento" name="status" value="em-andamento">
            <label for="status-em-andamento">Em andamento</label>
          </div>

          <div>
            <input type="radio" id="status-em-revisao" name="status" value="em-revisao">
            <label for="status-em-revisao">Em revisão</label>
          </div>

          <div>
            <input type="radio" id="status-concluida" name="status" value="concluida">
            <label for="status-concluida">Concluída</label>
          </div>
        </fieldset>

        <!-- Filtro por prioridade -->
        <fieldset>
          <legend>Filtrar por prioridade</legend>

          <div>
            <input type="radio" id="prioridade-todas" name="prioridade" value="todas" checked>
            <label for="prioridade-todas">Todas</label>
          </div>

          <div>
            <input type="radio" id="prioridade-baixa" name="prioridade" value="baixa">
            <label for="prioridade-baixa">Baixa</label>
          </div>

          <div>
            <input type="radio" id="prioridade-media" name="prioridade" value="media">
            <label for="prioridade-media">Média</label>
          </div>

          <div>
            <input type="radio" id="prioridade-alta" name="prioridade" value="alta">
            <label for="prioridade-alta">Alta</label>
          </div>
        </fieldset>

        <button type="submit">Aplicar filtros</button>

      </form>
    </section>

    <!-- ===================== QUADRO ===================== -->
    <section aria-labelledby="quadro-heading">
      <h2 id="quadro-heading">Quadro de tarefas</h2>

      <!-- Tela de carregando / vazio / erro. Vazia e escondida no
           HTML estático; js/estados.js decide quando aparece e com
           qual texto (sempre por textContent). -->
      <div id="mensagem-estado" hidden></div>

      <!-- Tela de sucesso: as 4 colunas. Escondida enquanto outro
           estado estiver valendo; as <ul> começam vazias porque as
           tarefas agora vêm de dados.json via fetch, não mais
           escritas à mão aqui. -->
      <div id="quadro-colunas" hidden>

        <!-- ---------- Coluna: A fazer ---------- -->
        <section aria-labelledby="status-a-fazer">
          <h3 id="status-a-fazer">A fazer</h3>
          <ul></ul>
        </section>

        <!-- ---------- Coluna: Em andamento ---------- -->
        <section aria-labelledby="status-em-andamento-heading">
          <h3 id="status-em-andamento-heading">Em andamento</h3>
          <ul></ul>
        </section>

        <!-- ---------- Coluna: Em revisão ---------- -->
        <section aria-labelledby="status-em-revisao-heading">
          <h3 id="status-em-revisao-heading">Em revisão</h3>
          <ul></ul>
        </section>

        <!-- ---------- Coluna: Concluída ---------- -->
        <section aria-labelledby="status-concluida-heading">
          <h3 id="status-concluida-heading">Concluída</h3>
          <ul></ul>
        </section>

      </div>

    </section>

  </main>

  <!-- ===================== RODAPÉ ===================== -->
  <footer>
    <p>Desenvolvido por Kaio Bezerra Santos — Disciplina: Desenvolvimento Front-end</p>
  </footer>

  <script type="module" src="js/main.js"></script>

</body>
</html>
